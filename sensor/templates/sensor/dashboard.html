<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리빙랩 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId={{ naver_map_client_id }}&submodules=visualization"></script>
  <style>
    html, body { font-family: 'Noto Sans KR', system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Apple SD Gothic Neo','Malgun Gothic','Segoe UI Emoji'; }
    .sensor-marker { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9999px; color:#fff; font-size:12px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.25); border:2px solid #fff; }
  </style>
</head>
<body class="min-h-screen bg-[#f5f7f1] text-neutral-800">
  <header class="sticky top-0 z-30 backdrop-blur bg-white/70 border-b border-neutral-200/60">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-3">
      <div class="h-8 w-8 rounded-xl bg-gradient-to-br from-lime-400 to-emerald-500 shadow-sm"></div>
      <span class="font-semibold tracking-tight">리빙랩 대시보드</span>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10 space-y-10">

    <!-- ===================== 센서 지도 ===================== -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold tracking-tight">리빙랩 지도</h2>
        <span id="map-updated" class="text-xs text-neutral-500"></span>
      </div>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
          <div class="text-xs font-semibold text-neutral-500 mb-2">온도 설정 (초과 시 경고 표시, °C)</div>
          <div class="flex gap-2">
            <input id="temp-threshold" type="number" value="35" class="w-full rounded-xl border border-neutral-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
            <button onclick="applyThresholds()" class="shrink-0 rounded-xl bg-blue-600 text-white text-sm px-4 py-2 hover:bg-blue-700">적용</button>
          </div>
        </div>
        <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
          <div class="text-xs font-semibold text-neutral-500 mb-2">CO₂ 설정 (초과 시 경고 표시, ppm)</div>
          <div class="flex gap-2">
            <input id="co2-threshold" type="number" value="1000" class="w-full rounded-xl border border-neutral-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
            <button onclick="applyThresholds()" class="shrink-0 rounded-xl bg-blue-600 text-white text-sm px-4 py-2 hover:bg-blue-700">적용</button>
          </div>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
          <div class="text-xs font-semibold text-neutral-500 mb-2">동작 상태</div>
          <div class="flex gap-2">
            <select id="mode-filter" class="w-full rounded-xl border border-neutral-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
              <option value="all">전체</option>
              <option value="direct">direct</option>
              <option value="mobile">mobile</option>
            </select>
            <button onclick="renderMarkers()" class="shrink-0 rounded-xl bg-blue-600 text-white text-sm px-4 py-2 hover:bg-blue-700">적용</button>
          </div>
        </div>
        <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
          <div class="text-xs font-semibold text-neutral-500 mb-2">시각화</div>
          <button id="heatmap-toggle" onclick="toggleHeatmap()" class="w-full rounded-xl bg-neutral-800 text-white text-sm px-4 py-2 hover:bg-neutral-900">히트맵 켜기</button>
        </div>
      </div>

      <button onclick="refreshAll()" class="w-full rounded-2xl bg-blue-50 text-blue-700 text-sm font-semibold px-4 py-3 hover:bg-blue-100 mb-4">🔄 데이터 갱신</button>

      <div id="map" class="w-full h-[420px] rounded-3xl shadow-xl ring-1 ring-black/5 bg-white"></div>
    </section>

    <!-- ===================== 실시간 현황 ===================== -->
    <section>
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold tracking-tight">실시간 기후 데이터</h2>
        <span id="realtime-updated" class="text-xs text-neutral-500"></span>
      </div>
      <div class="grid md:grid-cols-3 gap-6">
        <div class="relative rounded-3xl bg-white p-6 shadow-xl ring-1 ring-black/5 overflow-hidden">
          <div class="relative flex items-baseline justify-between">
            <div>
              <div class="text-xs uppercase tracking-widest text-neutral-500">온도</div>
              <div id="rt-temp" class="mt-1 text-3xl font-bold text-neutral-900">-- <span class="text-base font-medium text-neutral-500 ml-1">°C</span></div>
            </div>
            <div class="text-xs bg-white/70 border border-neutral-200 rounded-full px-2 py-1">real-time</div>
          </div>
          <svg id="spark-temp" viewBox="0 0 360 80" class="mt-4 w-full"><polyline fill="none" stroke-width="2" stroke="currentColor" class="text-emerald-600" points=""></polyline></svg>
        </div>
        <div class="relative rounded-3xl bg-white p-6 shadow-xl ring-1 ring-black/5 overflow-hidden">
          <div class="relative flex items-baseline justify-between">
            <div>
              <div class="text-xs uppercase tracking-widest text-neutral-500">이산화탄소</div>
              <div id="rt-co2" class="mt-1 text-3xl font-bold text-neutral-900">-- <span class="text-base font-medium text-neutral-500 ml-1">ppm</span></div>
            </div>
            <div class="text-xs bg-white/70 border border-neutral-200 rounded-full px-2 py-1">real-time</div>
          </div>
          <svg id="spark-co2" viewBox="0 0 360 80" class="mt-4 w-full"><polyline fill="none" stroke-width="2" stroke="currentColor" class="text-emerald-600" points=""></polyline></svg>
        </div>
        <div class="relative rounded-3xl bg-white p-6 shadow-xl ring-1 ring-black/5 overflow-hidden">
          <div class="relative flex items-baseline justify-between">
            <div>
              <div class="text-xs uppercase tracking-widest text-neutral-500">강수량 (PWS 평균)</div>
              <div id="rt-precip" class="mt-1 text-3xl font-bold text-neutral-900">-- <span class="text-base font-medium text-neutral-500 ml-1">mm/hr</span></div>
            </div>
            <div class="text-xs bg-white/70 border border-neutral-200 rounded-full px-2 py-1">real-time</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== 상세 분석 ===================== -->
    <section>
      <h2 class="text-xl font-bold tracking-tight">기후 데이터 상세 분석</h2>
      <p class="text-sm text-neutral-500 mt-1">과거 센서 데이터를 조회하여 시계열 변화를 분석합니다.</p>

      <div class="mt-6 grid md:grid-cols-4 gap-6">
        <div class="md:col-span-1 space-y-4">
          <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
            <div class="text-xs font-semibold text-neutral-500 mb-2">데이터 선택</div>
            <div class="flex gap-2">
              <button id="btn-metric-temp" onclick="toggleMetric('temperature')" class="flex-1 rounded-xl bg-emerald-600 text-white text-sm px-3 py-2">온도</button>
              <button id="btn-metric-co2" onclick="toggleMetric('co2')" class="flex-1 rounded-xl bg-blue-600 text-white text-sm px-3 py-2">CO₂</button>
            </div>
          </div>

          <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
            <div class="text-xs font-semibold text-neutral-500 mb-2">센서 선택</div>
            <div class="max-h-48 overflow-y-auto text-sm space-y-1 pr-1">
              <label class="flex items-center gap-2">
                <input type="checkbox" id="sensor-all" checked onchange="onSensorAllToggle()">
                전체 평균 (정상 동작)
              </label>
              {% for s in sensors %}
              <label class="flex items-center gap-2">
                <input type="checkbox" class="sensor-item" value="{{ s }}" onchange="onSensorItemToggle()">
                센서 {{ s }}
              </label>
              {% endfor %}
            </div>
          </div>

          <div class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
            <div class="text-xs font-semibold text-neutral-500 mb-2">기간 설정</div>
            <div class="grid grid-cols-3 gap-2 text-sm mb-3">
              <button onclick="setPeriod(1)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">1시간</button>
              <button onclick="setPeriod(6)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">6시간</button>
              <button onclick="setPeriod(24)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">1일</button>
              <button onclick="setPeriod(24*7)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">7일</button>
              <button onclick="setPeriod(24*30)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">1개월</button>
              <button onclick="setPeriod(24*365)" class="rounded-xl border border-neutral-200 px-2 py-1.5 hover:bg-neutral-50">1년</button>
            </div>
            <label class="text-xs text-neutral-500">시작</label>
            <input id="start-input" type="datetime-local" class="w-full rounded-xl border border-neutral-200 px-2 py-1.5 text-sm mb-2">
            <label class="text-xs text-neutral-500">종료</label>
            <input id="end-input" type="datetime-local" class="w-full rounded-xl border border-neutral-200 px-2 py-1.5 text-sm mb-3">
            <button onclick="queryTimeseries()" class="w-full rounded-xl bg-emerald-600 text-white text-sm font-semibold px-4 py-2.5 hover:bg-emerald-700">조회하기</button>
          </div>
        </div>

        <div class="md:col-span-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-black/5">
          <div class="text-sm font-semibold text-neutral-700 mb-2">온도 &amp; 이산화탄소 변화 추이</div>
          <canvas id="timeseries-chart" class="w-full" height="110"></canvas>
        </div>
      </div>
    </section>

  </main>

  <script>
    const API_MAP = '/sensor/api/map';
    const API_REALTIME = '/sensor/api/realtime';
    const API_TIMESERIES = '/sensor/api/timeseries';

    let map, heatmap, heatmapOn = false;
    let markers = [];
    let mapData = [];
    let thresholds = { temp: 35, co2: 1000 };
    let chart;
    let visibleMetrics = { temperature: true, co2: true };

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(36.6285, 127.4565),
        zoom: 16,
      });
    }

    function extractNumber(sensorName) {
      const m = String(sensorName).match(/(\d+)/);
      return m ? m[1] : '?';
    }

    function markerColor(item) {
      if (!item.fresh) return '#9ca3af'; // gray: offline
      if (item.temperature > thresholds.temp || item.co2 > thresholds.co2) return '#f59e0b'; // orange: warning
      return '#10b981'; // green: normal
    }

    function applyThresholds() {
      thresholds.temp = parseFloat(document.getElementById('temp-threshold').value) || 999;
      thresholds.co2 = parseFloat(document.getElementById('co2-threshold').value) || 99999;
      renderMarkers();
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
    }

    function renderMarkers() {
      if (!map) return;
      clearMarkers();
      const modeFilter = document.getElementById('mode-filter').value;

      mapData.forEach(item => {
        if (modeFilter !== 'all' && item.mode !== modeFilter) return;
        const color = markerColor(item);
        const label = extractNumber(item.sensor);
        const marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(item.latitude, item.longitude),
          map: map,
          icon: {
            content: `<div class="sensor-marker" style="background:${color}">${label}</div>`,
            anchor: new naver.maps.Point(17, 17),
          },
        });
        const info = new naver.maps.InfoWindow({
          content: `<div style="padding:8px 10px;font-size:12px;">
            <b>${item.sensor}</b><br>
            온도: ${item.temperature}°C<br>
            CO2: ${item.co2}ppm<br>
            시간: ${item.time}
          </div>`,
        });
        naver.maps.Event.addListener(marker, 'click', () => {
          if (info.getMap()) { info.close(); } else { info.open(map, marker); }
        });
        markers.push(marker);
      });

      if (heatmapOn) buildHeatmap();
    }

    function buildHeatmap() {
      if (heatmap) { heatmap.setMap(null); }
      const points = mapData
        .filter(item => item.co2 != null)
        .map(item => new naver.maps.LatLng(item.latitude, item.longitude));
      heatmap = new naver.maps.visualization.HeatMap({
        map: map,
        data: points,
      });
    }

    function toggleHeatmap() {
      heatmapOn = !heatmapOn;
      const btn = document.getElementById('heatmap-toggle');
      if (heatmapOn) {
        btn.textContent = '히트맵 끄기';
        btn.classList.add('bg-purple-700');
        buildHeatmap();
      } else {
        btn.textContent = '히트맵 켜기';
        btn.classList.remove('bg-purple-700');
        if (heatmap) heatmap.setMap(null);
      }
    }

    async function loadSensorMap() {
      const res = await fetch(API_MAP);
      const json = await res.json();
      mapData = json.results || json;
      renderMarkers();
      document.getElementById('map-updated').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');
    }

    function buildSparkline(elId, values) {
      const el = document.querySelector(`#${elId} polyline`);
      if (!el || !values.length) return;
      const min = Math.min(...values), max = Math.max(...values);
      const range = (max - min) || 1;
      const stepX = 360 / (values.length - 1 || 1);
      const points = values.map((v, i) => {
        const x = (i * stepX).toFixed(1);
        const y = (72 - ((v - min) / range) * 64).toFixed(1);
        return `${x},${y}`;
      }).join(' ');
      el.setAttribute('points', points);
    }

    async function loadRealtime() {
      const res = await fetch(API_REALTIME);
      const json = await res.json();
      document.getElementById('rt-temp').innerHTML = `${json.temperature ?? '--'} <span class="text-base font-medium text-neutral-500 ml-1">°C</span>`;
      document.getElementById('rt-co2').innerHTML = `${json.co2 ?? '--'} <span class="text-base font-medium text-neutral-500 ml-1">ppm</span>`;
      document.getElementById('rt-precip').innerHTML = `${json.precipRate ?? '--'} <span class="text-base font-medium text-neutral-500 ml-1">mm/hr</span>`;
      document.getElementById('realtime-updated').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');

      const end = new Date();
      const start = new Date(end.getTime() - 3600 * 1000);
      const tsRes = await fetch(`${API_TIMESERIES}?sensors=all&start=${start.toISOString()}&end=${end.toISOString()}`);
      const ts = await tsRes.json();
      const temps = ts.data.map(d => d.temperature).filter(v => v != null);
      const co2s = ts.data.map(d => d.co2).filter(v => v != null);
      buildSparkline('spark-temp', temps);
      buildSparkline('spark-co2', co2s);
    }

    function onSensorAllToggle() {
      if (document.getElementById('sensor-all').checked) {
        document.querySelectorAll('.sensor-item').forEach(el => el.checked = false);
      }
    }

    function onSensorItemToggle() {
      const anyChecked = Array.from(document.querySelectorAll('.sensor-item')).some(el => el.checked);
      document.getElementById('sensor-all').checked = !anyChecked;
    }

    function selectedSensorsParam() {
      if (document.getElementById('sensor-all').checked) return 'all';
      const selected = Array.from(document.querySelectorAll('.sensor-item'))
        .filter(el => el.checked)
        .map(el => el.value);
      return selected.length ? selected.join(',') : 'all';
    }

    function toLocalInputValue(date) {
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function setPeriod(hours) {
      const end = new Date();
      const start = new Date(end.getTime() - hours * 3600 * 1000);
      document.getElementById('start-input').value = toLocalInputValue(start);
      document.getElementById('end-input').value = toLocalInputValue(end);
      queryTimeseries();
    }

    function toggleMetric(metric) {
      visibleMetrics[metric] = !visibleMetrics[metric];
      const btnId = metric === 'temperature' ? 'btn-metric-temp' : 'btn-metric-co2';
      document.getElementById(btnId).classList.toggle('opacity-40', !visibleMetrics[metric]);
      if (chart) {
        const idx = metric === 'temperature' ? 0 : 1;
        chart.setDatasetVisibility(idx, visibleMetrics[metric]);
        chart.update();
      }
    }

    function formatLabel(iso, bucketSeconds) {
      const d = new Date(iso);
      if (bucketSeconds >= 86400) {
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }
      const pad = n => String(n).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function queryTimeseries() {
      const startVal = document.getElementById('start-input').value;
      const endVal = document.getElementById('end-input').value;
      const params = new URLSearchParams({ sensors: selectedSensorsParam() });
      if (startVal) params.set('start', startVal);
      if (endVal) params.set('end', endVal);

      const res = await fetch(`${API_TIMESERIES}?${params.toString()}`);
      const json = await res.json();
      const labels = json.data.map(d => formatLabel(d.time, json.bucket_seconds));
      const temps = json.data.map(d => d.temperature);
      const co2s = json.data.map(d => d.co2);

      if (chart) chart.destroy();
      const ctx = document.getElementById('timeseries-chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: '온도 (°C)',
              data: temps,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16,185,129,0.15)',
              yAxisID: 'y',
              tension: 0.3,
              pointRadius: 0,
              hidden: !visibleMetrics.temperature,
            },
            {
              label: '이산화탄소 (ppm)',
              data: co2s,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59,130,246,0.12)',
              yAxisID: 'y1',
              tension: 0.3,
              pointRadius: 0,
              hidden: !visibleMetrics.co2,
            },
          ],
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { type: 'linear', position: 'left', title: { display: true, text: '온도 (°C)' } },
            y1: { type: 'linear', position: 'right', title: { display: true, text: 'CO2 (ppm)' }, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    function refreshAll() {
      loadSensorMap();
      loadRealtime();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setPeriod(24);
      refreshAll();
      setInterval(refreshAll, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
