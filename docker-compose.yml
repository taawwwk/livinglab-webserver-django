version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: livinglab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livinglab_sensor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - /mnt/storage/livinglab/db_data:/var/lib/postgresql/data
      - /mnt/backup:/mnt/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - livinglab_network

  web:
    build: .
    container_name: livinglab_web
    restart: unless-stopped
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:10021 --workers 4 --access-logfile - --error-logfile - livinglab.wsgi:application"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secret-key-change-in-production"
      DB_NAME: livinglab_sensor
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      # 값은 이 디렉터리의 .env에 둔다 (git 미추적)
      OPENSRC_HMAC_KEY: ${OPENSRC_HMAC_KEY:?OPENSRC_HMAC_KEY must be set in .env}
      OPENSRC_TAG_LEN: ${OPENSRC_TAG_LEN:-8}
      # 가게 침수 실증 수위센서 API 키 (콤마 구분, .env에서 읽음). 비어 있으면 요청 전부 거부
      SHOP_API_KEYS: ${SHOP_API_KEYS:-}
    ports:
      - "127.0.0.1:8081:10021"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /mnt/storage/livinglab/logs:/app/logs
      - /mnt/storage/livinglab/staticfiles:/app/staticfiles
      - /mnt/storage/cctv:/mnt/storage/cctv
    networks:
      - livinglab_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

  scheduler:
    build: .
    container_name: livinglab_scheduler
    restart: unless-stopped
    command: python manage.py runscheduler
    environment:
      # CCTV 녹화 on/off 스위치. PWS 기상 수집은 이 값과 무관하게 계속 돈다.
      CCTV_RECORDING_ENABLED: "false"
      DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secret-key-change-in-production"
      DB_NAME: livinglab_sensor
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /mnt/storage/livinglab/logs:/app/logs
      - /mnt/storage/cctv:/mnt/storage/cctv
    networks:
      - livinglab_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "7"

networks:
  livinglab_network:
    driver: bridge
